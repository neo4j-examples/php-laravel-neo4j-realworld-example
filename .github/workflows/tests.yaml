name: Tests

on:
  push:
    branches: [ 'main' ]
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phpunit:
    name: Tests (PHP 8.3, Neo4j 5)
    runs-on: ubuntu-latest

    services:
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/password
        ports:
          - 7687:7687
        options: >-
          --health-cmd "wget -q --method=HEAD http://localhost:7474 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20

    env:
      DB_CONNECTION: neo4j
      NEO4J_URL: bolt://localhost:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: password

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare the environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Create Neo4j constraints and indexes
        run: docker exec -i ${{ job.services.neo4j.id }} cypher-shell -u neo4j -p password < database/neo4j/schema.cypher

      - name: Run the test suite
        run: vendor/bin/phpunit

      - name: Check the demo data script
        run: |
          docker exec -i ${{ job.services.neo4j.id }} cypher-shell -u neo4j -p password < database/neo4j/seed.cypher
          docker exec -i ${{ job.services.neo4j.id }} cypher-shell -u neo4j -p password < database/neo4j/seed.cypher

      - name: Start the API
        run: |
          echo 'API_RATE_LIMIT=1000' >> .env
          php artisan serve --host=127.0.0.1 --port=8000 > storage/logs/serve.log 2>&1 &
          timeout 30 sh -c 'until curl -sf http://127.0.0.1:8000/api/tags > /dev/null; do sleep 1; done'

      - name: Check out the RealWorld API spec
        uses: actions/checkout@v7
        with:
          repository: gothinkster/realworld
          ref: ebbcdeb8d55b42a3a613c787560498b8ef10003f
          path: realworld
          sparse-checkout: specs/api/hurl

      - name: Run the RealWorld API spec
        working-directory: realworld/specs/api/hurl
        run: |
          docker run --rm --network host -v "$PWD:/hurl:ro" ghcr.io/orange-opensource/hurl:7.1.0 \
            --test --jobs 1 --variable host=http://127.0.0.1:8000 --variable "uid=$(date +%s)" $(ls *.hurl | sed 's#^#/hurl/#')

      - name: Show the API log
        if: failure()
        run: cat storage/logs/serve.log storage/logs/laravel.log || true
