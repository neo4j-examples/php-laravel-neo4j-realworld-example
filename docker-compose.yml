services:
    neo4j:
        image: neo4j:5-community
        healthcheck:
            test: "wget -q --method=HEAD http://localhost:7474 || exit 1"
            interval: 30s
            timeout: 10s
            retries: 5
        ports:
            - "7687:7687"
            - "7474:7474"
        environment:
            NEO4J_AUTH: neo4j/password
            NEO4J_PLUGINS: '["apoc"]'
            NEO4J_dbms_security_allow__csv__import__from__file__urls: "true"
        volumes:
            - ./tests/resources:/import
